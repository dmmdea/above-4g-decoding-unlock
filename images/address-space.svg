<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0D1117" fill-opacity="1"/><rect x="0" y="0" width="1080" height="10" rx="0" fill="#58A6FF" fill-opacity="1"/><text x="72" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#58A6FF" text-anchor="start" letter-spacing="3">SECOND-LIFE HARDWARE  ·  HIDDEN BIOS SETTINGS</text><text x="72" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#E6EDF3" text-anchor="start">The setting your PC</text><text x="72" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" fill="#58A6FF" text-anchor="start">has, but hides.</text><text x="72" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#8B949E" text-anchor="start">Why a 16 GB datacenter GPU won't boot in some small office</text><text x="72" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#8B949E" text-anchor="start">PCs, and how to switch it on.</text><rect x="72" y="470" width="360" height="150" rx="14" fill="#161B22" fill-opacity="1"/><rect x="72" y="470" width="360" height="150" rx="14" fill="#10251A" fill-opacity="1" stroke="#238636" stroke-width="2"/><rect x="72" y="626" width="360" height="444" rx="14" fill="#2A1416" fill-opacity="1" stroke="#F85149" stroke-width="2"/><rect x="112" y="520" width="280" height="96" rx="12" fill="#161B22" fill-opacity="1" stroke="#3FB950" stroke-width="2"/><text x="252.0" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#E6EDF3" text-anchor="middle">GPU  ·  16 GB</text><text x="238.0" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#3FB950" text-anchor="middle">fits here</text><polyline points="304.0,598 311.7,606.8 326.0,587.0" fill="none" stroke="#3FB950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="252.0" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#3FB950" text-anchor="middle">ABOVE 4 GB:  new 256 GB window</text><line x1="62" y1="620" x2="442" y2="620" stroke="#D29922" stroke-width="3" stroke-dasharray="10 6"/><text x="454" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#D29922" text-anchor="start">4 GB line</text><rect x="96" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><rect x="148" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><rect x="200" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><rect x="252" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><rect x="304" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><rect x="356" y="1000" width="34" height="46" rx="6" fill="#F85149" fill-opacity="0.5"/><text x="252.0" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F85149" text-anchor="middle">BELOW 4 GB: full</text><text x="252.0" y="728" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#8B949E" text-anchor="middle">“PCI Out of</text><text x="252.0" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#8B949E" text-anchor="middle">Resources”</text><circle cx="524" cy="552" r="26" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><text x="524" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#58A6FF" text-anchor="middle">1</text><text x="568" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#E6EDF3" text-anchor="start">The card needs its memory</text><text x="568" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" fill="#8B949E" text-anchor="start">mapped above the 4 GB line.</text><circle cx="524" cy="702" r="26" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><text x="524" y="710" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#58A6FF" text-anchor="middle">2</text><text x="568" y="696" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#E6EDF3" text-anchor="start">“Above 4G Decoding” does that,</text><text x="568" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" fill="#8B949E" text-anchor="start">but some vendors hide it.</text><circle cx="524" cy="852" r="26" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><text x="524" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#58A6FF" text-anchor="middle">3</text><text x="568" y="846" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#E6EDF3" text-anchor="start">Switch it on in the firmware's</text><text x="568" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" fill="#8B949E" text-anchor="start">own UEFI variables. Reversible.</text><rect x="72" y="1120" width="936" height="150" rx="16" fill="#1C2129" fill-opacity="1" stroke="#30363D" stroke-width="1.5"/><text x="540.0" y="1174" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#E6EDF3" text-anchor="middle">Open source: guarded tools, backups, dry-run by default</text><text x="540.0" y="1220" font-family="Consolas, monospace" font-size="28" font-weight="600" fill="#58A6FF" text-anchor="middle">github.com/dmmdea/above-4g-decoding-unlock</text><text x="540.0" y="1256" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#8B949E" text-anchor="middle">A reversible settings change, not a soldering job.</text></svg>